# Environment for MORFE.jl Pluto notebooks.
# On Binder, `binder.plutojl.org` resolves the MORFE source from the repo root
# via the [sources] path entry below.  Locally, replace with:
#   Pkg.develop(PackageSpec(path = ".."))

name = "MORFENotebooks"
uuid = "a09b7b91-0001-0001-0001-000000000001"

[deps]
HDF5      = "f67ccb44-e63f-5c2f-98bd-6dc0ccc4ba2f"
LinearAlgebra = "37e2e46d-f89d-539d-b4ee-838fcccc9c8e"
MORFE     = "5d3630f1-b769-440d-b6a6-faf39c53b66e"
Plots     = "91a5bcdd-55d7-5caf-9e0b-520d859cae80"
Pluto     = "c3e4b0f8-55cb-11ea-2926-15256bba5781"
PlutoUI   = "7f904dfe-b85e-4ff6-b463-dae2292396a8"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"

[sources]
MORFE = {path = ".."}

[compat]
HDF5         = "0.17"
MORFE        = "3"
Plots        = "1"
Pluto        = "0.19, 0.20"
PlutoUI      = "0.7"
StaticArrays = "1"
julia        = "1.10"
