<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" role="img" aria-labelledby="title desc" style="font-family:&#39;JetBrains Mono&#39;,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">
  <title id="title">Direct Parametrisation of Invariant Manifolds</title>
  <desc id="desc">A reduced d-dimensional q-space is mapped by Psi onto an invariant manifold W tangent to the master eigenspace inside the full-order ambient y-space. A trajectory in q-space lifts to a converging trajectory on the manifold.</desc>

  <defs>
    <marker id="dpim-arr-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b8b8c4"></path>
    </marker>
    <marker id="dpim-arr-purple" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9558b2"></path>
    </marker>
    <marker id="dpim-arr-green" markerWidth="8" markerHeight="8" refX="7.5" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#389826"></path>
    </marker>
    <pattern id="dpim-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0 H0 V22" stroke="#1f1f2c" stroke-width="0.6" fill="none"></path>
    </pattern>
  </defs>

  
  <g stroke="#2a2a3a" stroke-width="1" fill="none">
    <path d="M16 16 H40 M16 16 V40"></path>
    <path d="M864 16 H840 M864 16 V40"></path>
    <path d="M16 364 H40 M16 364 V340"></path>
    <path d="M864 364 H840 M864 364 V340"></path>
  </g>

  
  <text x="48" y="34" font-size="10" letter-spacing="1.6" fill="#6e6e7e">METHOD · DPIM</text>
  <text x="832" y="34" font-size="10" letter-spacing="1.6" fill="#6e6e7e" text-anchor="end">SCHEMATIC · 01</text>

  
  <g transform="translate(56,90)">
    <text x="0" y="-30" font-size="10" letter-spacing="1.5" fill="#6e6e7e">REDUCED · MASTER COORDS · R<tspan font-size="8" baseline-shift="super">d</tspan></text>
    <text x="0" y="-12" font-size="14" fill="#e8e8ee" font-style="italic">q-space</text>

    
    <rect x="0" y="0" width="220" height="220" fill="url(#dpim-grid)" stroke="#2a2a3a" stroke-width="1"></rect>

    
    <line x1="22" y1="198" x2="200" y2="198" stroke="#b8b8c4" stroke-width="1" marker-end="url(#dpim-arr-ink)"></line>
    <line x1="22" y1="198" x2="22" y2="22" stroke="#b8b8c4" stroke-width="1" marker-end="url(#dpim-arr-ink)"></line>
    <text x="206" y="202" font-size="13" fill="#e8e8ee" font-style="italic">q₁</text>
    <text x="6" y="20" font-size="13" fill="#e8e8ee" font-style="italic">q₂</text>
    <circle cx="22" cy="198" r="1.8" fill="#b8b8c4"></circle>
    <text x="8" y="214" font-size="10" fill="#6e6e7e">0</text>

    
    <path d="M 178,52&#xA;             C 145,72 168,128 130,140&#xA;             C 92,152 66,118 90,94&#xA;             C 112,72 144,90 128,114&#xA;             C 116,130 92,124 88,108&#xA;             C 84,96 96,90 104,96&#xA;             C 110,100 108,108 102,108" stroke="#389826" stroke-width="1.6" fill="none" stroke-linecap="round" marker-end="url(#dpim-arr-green)"></path>

    
    <circle cx="178" cy="52" r="3.2" fill="#389826"></circle>
    <circle cx="178" cy="52" r="6" fill="none" stroke="#389826" stroke-width="0.8" stroke-opacity="0.5"></circle>
    <text x="184" y="48" font-size="12" fill="#389826" font-style="italic">q(t)</text>

    
    <text x="0" y="246" font-size="11" fill="#b8b8c4">
      <tspan font-style="italic">q̇</tspan> = <tspan font-style="italic">f</tspan>(<tspan font-style="italic">q</tspan>)
    </text>
    <text x="0" y="262" font-size="9" letter-spacing="1.3" fill="#6e6e7e">REDUCED DYNAMICS</text>
  </g>

  
  <g transform="translate(298,200)">
    
    <line x1="0" y1="22" x2="170" y2="22" stroke="#1f1f2c" stroke-width="1" stroke-dasharray="2 4"></line>

    
    <path d="M 4,2 C 50,-32 120,-32 168,2" stroke="#9558b2" stroke-width="1.4" fill="none" marker-end="url(#dpim-arr-purple)"></path>

    <text x="86" y="-32" font-size="13" fill="#e8e8ee" font-style="italic" text-anchor="middle">
      Ψ : R<tspan font-size="9" baseline-shift="super">d</tspan>  →  R<tspan font-size="9" baseline-shift="super">N</tspan>
    </text>

    
    <rect x="58" y="14" width="56" height="18" rx="2" fill="rgba(149,88,178,0.12)" stroke="#9558b2" stroke-width="0.8"></rect>
    <text x="86" y="26" font-size="10" letter-spacing="1.6" fill="#9558b2" text-anchor="middle">DPIM</text>

    
    <text x="86" y="48" font-size="9" letter-spacing="1.2" fill="#6e6e7e" text-anchor="middle">ORDER p · POLYNOMIAL</text>
  </g>

  
  <g transform="translate(490,90)">
    <text x="0" y="-30" font-size="10" letter-spacing="1.5" fill="#6e6e7e">AMBIENT · FE COORDS · R<tspan font-size="8" baseline-shift="super">N</tspan></text>
    <text x="0" y="-12" font-size="14" fill="#e8e8ee" font-style="italic">y-space</text>

    
    <rect x="0" y="0" width="334" height="220" fill="none" stroke="#2a2a3a" stroke-width="1"></rect>

    
    <g transform="translate(110,178)">

      
      <line x1="0" y1="0" x2="-44" y2="-28" stroke="#3a3a4c" stroke-width="1" stroke-dasharray="2 3"></line>

      
      <polygon points="-104,0 108,0 174,-58 -38,-58" fill="#4063d8" fill-opacity="0.06" stroke="#4063d8" stroke-width="0.7" stroke-dasharray="3 3"></polygon>

      
      <line x1="0" y1="0" x2="120" y2="-78" stroke="#b8b8c4" stroke-width="1" marker-end="url(#dpim-arr-ink)"></line>
      <text x="124" y="-82" font-size="13" fill="#e8e8ee" font-style="italic">y₂</text>

      
      <path d="&#xA;        M -104,0&#xA;        C -94,-26 -64,-52 -38,-58&#xA;        C 30,-80 96,-80 174,-58&#xA;        C 150,-32 130,-14 108,0&#xA;        C 48,18 -32,18 -104,0&#xA;        Z" fill="#9558b2" fill-opacity="0.16" stroke="#9558b2" stroke-width="1.3"></path>

      
      <path d="M -78,-14 C -20,-52 70,-62 152,-42" stroke="#9558b2" stroke-width="0.6" stroke-opacity="0.55" fill="none" stroke-dasharray="2 3"></path>
      <path d="M -54,8 C 0,-26 92,-32 162,-12" stroke="#9558b2" stroke-width="0.6" stroke-opacity="0.45" fill="none" stroke-dasharray="2 3"></path>

      
      <line x1="0" y1="0" x2="200" y2="0" stroke="#b8b8c4" stroke-width="1" marker-end="url(#dpim-arr-ink)"></line>
      <text x="206" y="5" font-size="13" fill="#e8e8ee" font-style="italic">y₁</text>

      
      <line x1="0" y1="0" x2="0" y2="-152" stroke="#b8b8c4" stroke-width="1" marker-end="url(#dpim-arr-ink)"></line>
      <text x="-18" y="-158" font-size="13" fill="#e8e8ee" font-style="italic">y₃</text>

      
      <circle cx="0" cy="0" r="2.2" fill="#b8b8c4"></circle>
      <text x="-12" y="14" font-size="10" fill="#6e6e7e">0</text>

      
      <text x="-38" y="-66" font-size="10" fill="#7a92dc" font-style="italic">E · master eigenspace</text>

      <text x="50" y="-86" font-size="11" fill="#c79be0" font-style="italic">W · invariant manifold</text>
      <line x1="64" y1="-78" x2="78" y2="-62" stroke="#9558b2" stroke-width="0.6" stroke-opacity="0.6"></line>

      
      <path d="M 152,-42&#xA;               C 110,-58 64,-60 22,-46&#xA;               C -14,-30 -28,-8 -8,6&#xA;               C 14,16 32,4 24,-12&#xA;               C 18,-24 4,-22 4,-10&#xA;               C 4,-2 0,0 0,0" stroke="#9558b2" stroke-width="1.7" fill="none" stroke-linecap="round" marker-end="url(#dpim-arr-purple)"></path>

      
      <circle cx="152" cy="-42" r="3.2" fill="#9558b2"></circle>
      <circle cx="152" cy="-42" r="6" fill="none" stroke="#9558b2" stroke-width="0.8" stroke-opacity="0.5"></circle>
      <text x="160" y="-46" font-size="12" fill="#9558b2" font-style="italic">Ψ(q(t))</text>

      
      <text x="-92" y="22" font-size="9" letter-spacing="1.1" fill="#6e6e7e">TANGENT AT 0</text>
    </g>

    
    <text x="0" y="246" font-size="11" fill="#b8b8c4">
      <tspan font-style="italic">M</tspan> ÿ + <tspan font-style="italic">C</tspan> ẏ + <tspan font-style="italic">K</tspan> y + <tspan font-style="italic">f</tspan><tspan font-size="8" baseline-shift="sub">nl</tspan>(y) = <tspan font-style="italic">p</tspan>(<tspan font-style="italic">t</tspan>)
    </text>
    <text x="0" y="262" font-size="9" letter-spacing="1.3" fill="#6e6e7e">FULL-ORDER FE MODEL</text>
  </g>
</svg>