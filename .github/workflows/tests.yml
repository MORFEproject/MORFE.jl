name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Both ends of the declared `julia = "1.10"` compat bound, so the registry entry is
    # backed by a run: the lower bound users may resolve to, and the current stable.
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']

    name: Julia ${{ matrix.julia-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache packages
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage = true)'

      # `ext/` is included deliberately, even though the suite loads only Symbolics and so
      # leaves five of the six extensions unexecuted: hiding them would flatter the number.
      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext

      # Soft-fails while CODECOV_TOKEN is unset, so a missing secret never turns the suite red.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false