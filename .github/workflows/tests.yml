name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    # Exercise the lower bound, the intervening minor, and current stable.
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1.11', '1']

    name: Julia ${{ matrix.julia-version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache packages
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run tests without coverage
        if: matrix.julia-version != '1'
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      - name: Run tests with coverage on current stable
        if: matrix.julia-version == '1'
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage = true)'

      # `ext/` is included deliberately. Arpack, Plots, and Symbolics are exercised;
      # the platform-sensitive Pardiso and heavyweight BifurcationKit paths remain visible.
      - name: Process coverage
        if: matrix.julia-version == '1'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src,ext

      # Soft-fails while CODECOV_TOKEN is unset, so a missing secret never turns the suite red.
      - name: Upload coverage to Codecov
        if: matrix.julia-version == '1'
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: morfe
          name: MORFE
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  prerelease:
    if: github.event_name == 'schedule'
    continue-on-error: true
    runs-on: ubuntu-latest
    name: Julia prerelease (non-blocking)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia prerelease
        uses: julia-actions/setup-julia@v2
        with:
          version: 'pre'

      - name: Cache packages
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run prerelease tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  windows-sparse:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    name: Windows sparse cohomological solvers

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Cache packages
        uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Run parametrisation tests
        env:
          GROUP: parametrisation_method
        run: julia --project=. -e 'using Pkg; Pkg.test()'
