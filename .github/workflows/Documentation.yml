name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

# Permissions required for GitHub Pages artifact deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out MORFEFerrite companion package
        uses: actions/checkout@v4
        with:
          repository: MORFEproject/MORFEFerrite.jl
          ref: main
          path: MORFEFerrite.jl

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Install companion documentation dependencies
        run: julia --project=MORFEFerrite.jl -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'

      - name: Generate MORFE code documentation
        run: julia --project=. website/generate_documentation.jl

      - name: Generate static MORFE manifold artwork
        run: julia website/generate_manifold_accent.jl

      - name: Generate MORFEFerrite code documentation
        run: julia --project=MORFEFerrite.jl website/generate_morfeferrite_documentation.jl

      # Must follow both generators: the symbol map is scraped from the pages that will be
      # shipped, so links cannot point at stale anchors. Needs no packages, hence plain Julia.
      - name: Link API mentions in tutorials
        run: julia website/link_tutorials.jl

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
