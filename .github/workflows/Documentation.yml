name: Documentation

on:
  push:
    branches: [main]

# Permissions required for GitHub Pages artifact deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel in-progress if a new push arrives.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Generate code documentation
        run: julia --project=. website/generate_documentation.jl

      # Must follow the step above: the symbol map is scraped from the documentation.html
      # it just wrote, so the links can never point at a stale anchor.  Needs no packages,
      # hence plain `julia`.  Only the uploaded artifact is affected — nothing is committed,
      # so the tutorials stay free of link markup in git.
      - name: Link API mentions in tutorials
        run: julia website/link_tutorials.jl

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
