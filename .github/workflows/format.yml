name: Format

# SciML style, per .JuliaFormatter.toml at the repository root.
#
# The formatter environment lives in .github/format/ and pins JuliaFormatter exactly,
# Manifest included: its output depends on its own dependencies (CSTParser, Tokenize),
# so an unpinned run would reformat files nobody touched and turn this check red.
# Bump the pin deliberately, together with a reformat commit.
#
# Run the identical check locally — same environment, therefore the same output:
#
#   julia --project=.github/format -e 'using Pkg; Pkg.instantiate()'
#   julia --project=.github/format -e 'using JuliaFormatter; format(["src", "ext", "test"])'

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Cache packages
        uses: julia-actions/cache@v2

      - name: Install formatter
        run: julia --project=.github/format -e 'using Pkg; Pkg.instantiate()'

      # On push, auto-commit whatever the formatter changes.
      # On pull_request, "Fail if unformatted" below turns any diff into a failing check.
      - name: Format
        run: |
          julia --project=.github/format -e '
            using JuliaFormatter
            ok = format(["src", "ext", "test"]; verbose = true)'

      - name: Commit changes
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Apply JuliaFormatter"

      - name: Fail if unformatted
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code || (echo "::error::Files are not formatted. Run the formatter locally and push the changes." && exit 1)
      
      - name: Show required changes
        if: failure()
        run: git diff