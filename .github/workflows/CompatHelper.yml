name: CompatHelper

# Opens a pull request when a dependency releases a version outside the [compat] bounds.
# Registered packages need this: an unbumped bound silently locks users onto old releases.

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest

    steps:
      - name: Check if Julia is already available in the PATH
        id: julia_in_path
        run: which julia
        continue-on-error: true

      - name: Install Julia, but only if it is not already available in the PATH
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'
        if: steps.julia_in_path.outcome != 'success'

      - name: Install CompatHelper
        run: import Pkg; Pkg.add("CompatHelper")
        shell: julia --color=yes {0}

      # `bump_compat_containing_equality_specifier = false` leaves `Arpack = "= 0.5.3"`
      # alone: that pin is deliberate, not a stale bound.
      - name: Run CompatHelper
        run: import CompatHelper; CompatHelper.main(; bump_compat_containing_equality_specifier = false)
        shell: julia --color=yes {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
